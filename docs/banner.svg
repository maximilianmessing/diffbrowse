<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="480" rx="20" fill="url(#bg)"/>
  <rect width="1398" height="478" x="1" y="1" rx="19" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left Content: Typography & Value Proposition -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top badge -->
    <rect x="70" y="55" width="280" height="32" rx="16" fill="#1f242c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="86" cy="71" r="5" fill="#38bdf8"/>
    <text x="100" y="77" font-size="13" font-weight="600" fill="#7dd3fc" letter-spacing="1.5">OPEN-SOURCE AGENT ENGINE</text>

    <!-- Main Title -->
    <text x="68" y="165" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2">DIFFBROWSE</text>
    
    <!-- Subtitle -->
    <text x="70" y="215" font-size="24" font-weight="600" fill="#e6edf3" letter-spacing="-0.3">Discrete Diffusion for Local Browser Agents</text>
    <text x="70" y="252" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="0">
      Sub-second action grounding via logit slicing · Zero cloud egress · Air-gapped
    </text>

    <!-- Badges Row -->
    <g transform="translate(70, 300)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="600" fill="#58a6ff">🍏 Apple Silicon Metal</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="165" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="196" y="24" font-size="13" font-weight="600" fill="#3fb950">🛡️ 100% Air-Gapped</text>

      <!-- Badge 3 -->
      <rect x="360" y="0" width="180" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="376" y="24" font-size="13" font-weight="600" fill="#d2a8ff">⚡ DiffusionGemma 26B</text>
    </g>

    <!-- Requirement Warning -->
    <text x="70" y="380" font-size="14" font-weight="500" fill="#e3b341">
      ⚡ Requires ≥ 24 GB Unified Memory (Apple Silicon M-series Pro / Max / Ultra)
    </text>
  </g>

  <!-- Right Side: Graphic Visualizing Diffusion Denoising & Action Selection -->
  <g transform="translate(800, 60)">
    <!-- Browser Mockup Window -->
    <rect x="0" y="0" width="530" height="360" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Window Controls -->
    <path d="M0 42 H530" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#f85149"/>
    <circle cx="36" cy="21" r="5" fill="#e3b341"/>
    <circle cx="52" cy="21" r="5" fill="#2ea043"/>
    
    <!-- URL / Omnibox -->
    <rect x="75" y="10" width="370" height="22" rx="6" fill="#0d1117" stroke="#21262d"/>
    <text x="90" y="25" font-family="monospace" font-size="11" fill="#8b949e">local://browser · 0 ms network egress</text>

    <!-- Visual Content Inside Browser -->
    <g transform="translate(25, 60)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <!-- Pass 1: Initial Diffusion Logit Slicing -->
      <rect x="0" y="0" width="480" height="60" rx="8" fill="#0d1117" stroke="#21262d"/>
      <text x="15" y="24" font-size="11" font-weight="700" fill="#8b949e">DIFFUSION PASS 1 (t=0.50)</text>
      <text x="380" y="24" font-size="11" fill="#58a6ff">110 ms</text>
      <!-- Candidate distribution -->
      <text x="15" y="46" font-size="12" fill="#7ee787">[1] CLICK e4 (34%)</text>
      <text x="175" y="46" font-size="12" fill="#8b949e">[2] TYPE e7 (28%)</text>
      <text x="330" y="46" font-size="12" fill="#8b949e">[3] SELECT e2 (12%)</text>

      <!-- Arrow -->
      <path d="M240 70 L240 90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3"/>
      <polygon points="236,90 244,90 240,96" fill="#818cf8"/>

      <!-- Pass 2: Denoised & Confidence Margin -->
      <g transform="translate(0, 105)">
        <rect x="0" y="0" width="480" height="70" rx="8" fill="#121d2f" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
        <text x="15" y="24" font-size="11" font-weight="700" fill="#38bdf8">DIFFUSION PASS 2 (t=1.00) · CONVERGED</text>
        <text x="380" y="24" font-size="11" fill="#7ee787">220 ms</text>
        <text x="15" y="50" font-size="14" font-weight="700" fill="#58a6ff">[1] CLICK e4 (89%)</text>
        <text x="195" y="50" font-size="12" fill="#8b949e">[2] TYPE e7 (6%)</text>
        <text x="350" y="50" font-size="12" fill="#8b949e">M = 0.83</text>
      </g>

      <!-- Final Execution Card -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="480" height="75" rx="8" fill="#1c2128" stroke="#2ea043" stroke-width="1.5"/>
        <text x="15" y="24" font-size="11" font-weight="700" fill="#7ee787">⚡ GROUNDED ACTION DISPATCHED</text>
        <text x="350" y="24" font-size="11" fill="#7ee787">Total: 395 ms</text>
        
        <rect x="15" y="34" width="110" height="28" rx="5" fill="#238636"/>
        <text x="25" y="53" font-size="12" font-weight="700" fill="#ffffff">CLICK [e4]</text>

        <text x="140" y="53" font-size="12" fill="#e6edf3">#search-button · 0 cloud API tokens</text>
      </g>
    </g>
  </g>
</svg>
